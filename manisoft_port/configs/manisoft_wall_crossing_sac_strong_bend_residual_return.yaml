schema_version: 1

# A frozen deterministic Phase-A actor supplies the nominal wall-crossing
# increment.  SAC learns only a bounded residual for returning toward x=0.
environment:
  episode_steps: 300
  absolute_action_limit: 0.60
  muscle_torque_scale: 45.0
  max_action_delta: 0.001
  success_crossed_fraction: 0.40
  success_streak: 5
  maximum_tip_speed: null

  snapshot_minimum_fraction: 0.30
  snapshot_maximum_fraction: 0.35
  snapshot_progress_bias: 10.0

  return_tip_x_tolerance: 0.10
  return_reward_minimum_fraction: 0.40
  return_progress_reward_scale: 8.0

  base_policy_model_path: /root/autodl-tmp/AC-MPC/data/experiments/manisoft_strong_bend_e2mpa_r45mm_t45_a060_v1/sac_crossing_40pct_braked_v1/checkpoints/wall_crossing_sac_2500_steps.zip
  base_policy_vecnormalize_path: /root/autodl-tmp/AC-MPC/data/experiments/manisoft_strong_bend_e2mpa_r45mm_t45_a060_v1/sac_crossing_40pct_braked_v1/checkpoints/wall_crossing_sac_vecnormalize_2500_steps.pkl
  base_policy_device: cpu
  residual_action_scale: 0.10

  threading_progress_reward_scale: 80.0
  crossed_progress_reward_scale: 60.0
  tip_progress_reward_scale: 3.0
  collision_penalty: 35.0
  success_bonus: 30.0
  near_wall_clearance: 0.02
  near_wall_penalty_scale: 1.5
  step_penalty: 0.01
  policy_action_penalty_scale: 0.01
  activation_penalty_scale: 0.003

training:
  seed: 20260901
  total_timesteps: 10000
  num_envs: 2
  learning_rate: 0.00005
  buffer_size: 100000
  learning_starts: 500
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.0005
  target_entropy: -9.0
  net_arch: [256, 256, 256]
  checkpoint_freq: 5000
  status_freq: 500
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
