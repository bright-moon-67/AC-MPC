environment:
  # First table skill: certified bent reset -> 1.8--3.0 cm near-planar line.
  # The policy controls calibrated global table x/y increments.  The
  # environment integrates them into the physical 18-muscle action.
  curriculum: table_local_line
  episode_steps: 600
  absolute_action_limit: 0.30
  max_action_delta: 0.008
  action_mode: table_cartesian_delta
  equilibrium_rotation_degrees: 4.0
  equilibrium_xy_scale_delta: 0.03
  table_action_calibration_path: data/processed/manisoft_table_action_calibration_v1/calibration_1cm.npz
  cartesian_action_step_scale: 0.025
  cartesian_action_leak: 0.008
  workspace_low: [-0.30, 0.50, 0.445]
  workspace_high: [0.30, 0.80, 0.54]
  max_reach: 0.91
  tracking_guard: 0.025
  target_lead_distance: 0.008
  lookahead_distance: 0.018
  maximum_projection_advance: 0.020
  projection_backtrack: 0.005
  success_threshold: 0.010
  success_streak: 8
  terminal_capture_radius: 0.020
  stall_grace_steps: 80
  stall_window_steps: 200
  stall_progress_epsilon: 0.0005
  table_surface_z: 0.36
  minimum_tip_z: 0.415
  table_x_bounds: [-0.55, 0.55]
  table_y_bounds: [0.42, 0.86]
  arm_radius: 0.050
  table_safety_margin: 0.005
  enforce_whole_arm_table_clearance: true
  entry_bank_path: data/processed/manisoft_table_entry_bank_v1/entry_bank.npz
  min_desired_speed: 0.015
  max_desired_speed: 0.040
  entry_mid_anchor_probability: 0.0
  entry_mid_advance_fraction_range: [0.30, 0.55]
  entry_mid_anchor_fraction_range: [0.55, 0.85]
  entry_anchor_probability: 0.0
  entry_anchor_fraction_range: [0.30, 0.65]
  requested_rate_penalty_scale: 0.002
  policy_action_penalty_scale: 0.005
  endpoint_progress_scale: 0.45
  terminal_precision_scale: 1.0
  terminal_distance_penalty_scale: 0.50
  table_violation_penalty: 300.0
  terminal_settle_steps: 100
  terminal_timeout_penalty: 75.0

sac:
  learning_rate: 0.0001
  buffer_size: 1500000
  learning_starts: 10000
  batch_size: 2048
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 8
  # Starting at 1.0 made the deterministic policy drift away from the stable
  # calibrated equilibrium during the failed pilot.  Keep useful exploration
  # without overwhelming this smooth two-dimensional control problem.
  ent_coef: auto_0.05
  target_entropy: -1.0
  net_arch: [256, 256, 256]

training:
  total_timesteps: 3000000
  num_envs: 40
  checkpoint_freq: 100000
  eval_freq: 50000
  eval_episodes: 24
  save_replay_buffer: false
