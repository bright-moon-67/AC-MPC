schema_version: 1

# Curriculum continuation: initialize from the certified 30% checkpoint and
# teach the same controller to pull two additional 5 cm elements past the wall.
environment:
  episode_steps: 450
  absolute_action_limit: 0.30
  max_action_delta: 0.005
  success_crossed_fraction: 0.40
  success_streak: 5
  maximum_tip_speed: 0.75

  # The existing certified bank ends at 25%.  Retaining the 15%--25% range
  # preserves both route sides and forces the policy to solve 30%--40% itself.
  snapshot_minimum_fraction: 0.15
  snapshot_maximum_fraction: 0.25
  snapshot_progress_bias: 10.0

  threading_progress_reward_scale: 60.0
  crossed_progress_reward_scale: 24.0
  tip_progress_reward_scale: 2.0
  collision_penalty: 20.0
  success_bonus: 15.0
  # The 30% controller often reaches 40% by consuming nearly all clearance.
  # Start penalizing at 20 mm and make that signal material before collision.
  near_wall_clearance: 0.02
  near_wall_penalty_scale: 1.0
  step_penalty: 0.01
  policy_action_penalty_scale: 0.005
  activation_penalty_scale: 0.001

training:
  seed: 20260826
  total_timesteps: 40000
  num_envs: 2
  learning_rate: 0.0001
  buffer_size: 200000
  learning_starts: 5000
  batch_size: 512
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.001
  target_entropy: -9.0
  net_arch: [256, 256, 256]
  checkpoint_freq: 5000
  status_freq: 1000
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
