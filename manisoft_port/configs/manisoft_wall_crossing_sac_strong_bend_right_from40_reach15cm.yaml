schema_version: 1

# Reach-only feasibility criterion: one safe control frame inside 15 cm is
# sufficient.  Unsafe states can never count as success.
environment:
  episode_steps: 180
  absolute_action_limit: 0.60
  muscle_torque_scale: 45.0
  max_action_delta: 0.0005
  success_crossed_fraction: 0.40
  success_streak: 1
  maximum_tip_speed: null
  allowed_route_side: 1

  snapshot_minimum_fraction: 0.40
  snapshot_maximum_fraction: 0.40
  snapshot_progress_bias: 0.0

  return_tip_x_tolerance: 0.15
  return_reward_minimum_fraction: 0.40
  return_progress_reward_scale: 32.0

  threading_progress_reward_scale: 120.0
  crossed_progress_reward_scale: 170.0
  crossing_deficit_penalty_scale: 30.0
  required_crossing_margin: 0.020
  crossing_margin_progress_reward_scale: 150.0
  crossing_margin_deficit_penalty_scale: 150.0
  tip_progress_reward_scale: 2.0
  collision_penalty: 180.0
  success_bonus: 240.0
  near_wall_clearance: 0.025
  near_wall_penalty_scale: 5.0
  step_penalty: 0.002
  policy_action_penalty_scale: 0.002
  activation_penalty_scale: 0.001

training:
  seed: 20260915
  total_timesteps: 2500
  num_envs: 2
  learning_rate: 0.000005
  buffer_size: 100000
  learning_starts: 200
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.0001
  target_entropy: -9.0
  continuation_log_std_bias_delta: -1.0
  net_arch: [256, 256, 256]
  checkpoint_freq: 500
  status_freq: 250
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
