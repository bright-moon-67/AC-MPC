# Curriculum stage 1 for the 0.47 x 0.18 m tabletop workspace.
# Learn reliable two/three-segment tracking before restoring long 5--8
# segment paths. Target Z varies; capture accepts target_z +/- 2.5 cm.
environment:
  curriculum: table_waypoint_polyline
  episode_steps: 6500
  absolute_action_limit: 1.0
  max_action_delta: 0.00075
  action_mode: table_pose_residual
  observation_mode: legacy70
  table_pose_map_path: data/processed/manisoft_table_ground015_high_pose_map_v1/pose_map.npz
  pose_map_interpolation_mode: barycentric
  equilibrium_path_prior_weight: 1.0
  equilibrium_path_residual_scale: 0.005

  workspace_low: [-0.223, 0.575, 0.225]
  workspace_high: [0.247, 0.755, 0.275]
  max_reach: 1.0
  waypoint_segment_count_range: [2, 3]
  waypoint_segment_count_probabilities: [0.45, 0.55]
  waypoint_segment_length_range: [0.050, 0.100]
  waypoint_maximum_extent: 0.180
  waypoint_minimum_turn_degrees: 60.0
  waypoint_maximum_turn_degrees: 120.0
  waypoint_vertical_delta_range: [-0.012, 0.012]
  waypoint_single_line_probability: 0.0

  tracking_vertical_tolerance: 0.025
  internal_waypoint_capture_radius: 0.020
  internal_waypoint_bonus: 3.0
  internal_waypoint_progress_scale: 0.75
  internal_waypoint_distance_penalty_scale: 0.20
  waypoint_stall_steps: 2500
  waypoint_stall_distance_epsilon: 0.0002
  tracking_guard: 0.030
  cross_track_penalty_scale: 0.20
  tracking_distance_penalty_scale: 0.10
  target_lead_distance: 0.008
  lookahead_distance: 0.018
  maximum_projection_advance: 0.020
  projection_backtrack: 0.004
  success_threshold: 0.018
  success_streak: 8
  terminal_capture_radius: 0.028
  stall_grace_steps: 700
  stall_window_steps: 2800
  stall_progress_epsilon: 0.0002

  table_surface_z: 0.15
  minimum_tip_z: 0.150
  table_x_bounds: [-0.55, 0.55]
  table_y_bounds: [0.42, 0.86]
  arm_radius: 0.050
  table_safety_margin: 0.000
  table_clearance_violation_tolerance: 0.001
  enforce_whole_arm_table_clearance: false
  maximum_tip_orientation_error_degrees: 180.0
  tip_orientation_penalty_scale: 0.0
  tip_orientation_violation_penalty: 0.0
  terminate_on_tip_orientation_violation: false
  entry_bank_path: data/processed/manisoft_table_ground015_high_entry_v1/entry_bank.npz
  entry_sampling_weights: [1.0]

  min_desired_speed: 0.006
  max_desired_speed: 0.012
  requested_rate_penalty_scale: 0.001
  policy_action_penalty_scale: 0.050
  endpoint_progress_scale: 0.0
  terminal_precision_scale: 4.0
  terminal_distance_penalty_scale: 2.0
  table_violation_penalty: 300.0
  terminal_settle_steps: 500
  terminal_timeout_penalty: 100.0

sac:
  learning_rate: 0.00001
  buffer_size: 600000
  learning_starts: 10000
  batch_size: 1024
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 4
  ent_coef: 0.001
  target_entropy: -9.0
  net_arch: [256, 256, 256]

training:
  # On resume this is an additional stage budget.
  total_timesteps: 300000
  num_envs: 16
  checkpoint_freq: 25000
  eval_freq: 100000
  eval_episodes: 24
  save_replay_buffer: false
