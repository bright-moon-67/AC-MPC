schema_version: 1

# Phase A: from low-speed 30%/35% reset states, learn only to establish and
# hold a contiguous 40% distal crossing.  Target-plane return is deferred.
environment:
  episode_steps: 200
  absolute_action_limit: 0.60
  muscle_torque_scale: 45.0
  max_action_delta: 0.001
  success_crossed_fraction: 0.40
  success_streak: 5
  maximum_tip_speed: null

  snapshot_minimum_fraction: 0.30
  snapshot_maximum_fraction: 0.35
  snapshot_progress_bias: 10.0

  return_tip_x_tolerance: null
  return_reward_minimum_fraction: 0.40
  return_progress_reward_scale: 0.0

  threading_progress_reward_scale: 80.0
  crossed_progress_reward_scale: 50.0
  tip_progress_reward_scale: 3.0
  collision_penalty: 30.0
  success_bonus: 25.0
  near_wall_clearance: 0.02
  near_wall_penalty_scale: 1.0
  step_penalty: 0.01
  policy_action_penalty_scale: 0.01
  activation_penalty_scale: 0.003

training:
  seed: 20260828
  total_timesteps: 5000
  num_envs: 2
  learning_rate: 0.0001
  buffer_size: 50000
  learning_starts: 500
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.001
  target_entropy: -9.0
  net_arch: [256, 256, 256]
  checkpoint_freq: 2500
  status_freq: 500
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
