environment:
  curriculum: table_point
  # Transitional table-entry curriculum.  The moving reference may advance
  # inside a 5 cm tube, while endpoint success remains the requested 1 cm.
  episode_steps: 1500
  absolute_action_limit: 0.30
  max_action_delta: 0.01
  workspace_low: [-0.30, 0.38, 0.445]
  workspace_high: [0.30, 0.72, 0.56]
  max_reach: 0.90
  tracking_guard: 0.050
  lookahead_distance: 0.040
  success_threshold: 0.010
  success_streak: 8
  table_surface_z: 0.39
  minimum_tip_z: 0.405
  min_desired_speed: 0.040
  max_desired_speed: 0.070
  requested_rate_penalty_scale: 0.01
  terminal_precision_scale: 0.50
  terminal_distance_penalty_scale: 0.20

sac:
  learning_rate: 0.0001
  buffer_size: 2000000
  learning_starts: 20000
  batch_size: 512
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  # Eight environments with one update per vector step preserves the original
  # one-gradient-update-per-eight-transitions training ratio.
  gradient_steps: 1
  net_arch: [256, 256, 256]

training:
  # Additional samples after the inherited global 900k checkpoint.
  total_timesteps: 600000
  num_envs: 8
  checkpoint_freq: 100000
  eval_freq: 100000
  eval_episodes: 5
  save_replay_buffer: false
