environment:
  curriculum: table_long_waypoints
  episode_steps: 2400
  absolute_action_limit: 0.60
  max_action_delta: 0.003
  action_mode: table_pose_residual
  observation_mode: legacy70
  table_pose_path_bank_path: data/processed/manisoft_table_arch_pose_path_v1/path_bank.npz
  equilibrium_path_prior_weight: 1.0
  equilibrium_path_residual_scale: 0.030
  workspace_low: [0.18, 0.25, 0.415]
  workspace_high: [0.54, 0.65, 0.490]
  max_reach: 1.20
  # Four segments / five total points in the certified non-collinear bank.
  waypoint_segment_count_range: [4, 4]
  waypoint_segment_length_range: [0.070, 0.130]
  waypoint_maximum_extent: 0.30
  waypoint_minimum_turn_degrees: 60.0
  waypoint_maximum_turn_degrees: 120.0
  waypoint_vertical_delta_range: [0.0, 0.0]
  waypoint_single_line_probability: 0.0
  internal_waypoint_capture_radius: 0.018
  internal_waypoint_bonus: 1.0
  internal_waypoint_progress_scale: 0.35
  internal_waypoint_distance_penalty_scale: 0.12
  waypoint_stall_steps: 1800
  waypoint_stall_distance_epsilon: 0.0002
  tracking_guard: 0.030
  target_lead_distance: 0.012
  lookahead_distance: 0.025
  maximum_projection_advance: 0.020
  projection_backtrack: 0.004
  success_threshold: 0.010
  success_streak: 8
  terminal_capture_radius: 0.020
  stall_grace_steps: 400
  stall_window_steps: 2000
  stall_progress_epsilon: 0.0003
  table_surface_z: 0.36
  minimum_tip_z: 0.405
  table_x_bounds: [0.15, 0.65]
  table_y_bounds: [0.28, 0.72]
  arm_radius: 0.050
  table_safety_margin: 0.005
  enforce_whole_arm_table_clearance: true
  target_tip_tangent: [0.0, 0.0, -1.0]
  tip_orientation_penalty_scale: 0.30
  maximum_tip_orientation_error_degrees: 20.0
  tip_orientation_violation_penalty: 100.0
  terminate_on_tip_orientation_violation: true
  entry_bank_path: data/processed/manisoft_table_arch_multipoint_entry_damped_v1/entry_bank.npz
  entry_sampling_weights: [1.0]
  min_desired_speed: 0.008
  max_desired_speed: 0.020
  requested_rate_penalty_scale: 0.001
  policy_action_penalty_scale: 0.010
  endpoint_progress_scale: 0.0
  terminal_precision_scale: 2.0
  terminal_distance_penalty_scale: 1.0
  table_violation_penalty: 300.0
  terminal_settle_steps: 600
  terminal_timeout_penalty: 75.0

sac:
  learning_rate: 0.0001
  buffer_size: 500000
  learning_starts: 10000
  batch_size: 1024
  tau: 0.005
  gamma: 0.998
  train_freq: 1
  gradient_steps: 4
  ent_coef: auto_0.03
  target_entropy: -9.0
  net_arch: [256, 256, 256]

training:
  total_timesteps: 600000
  num_envs: 24
  checkpoint_freq: 50000
  eval_freq: 25000
  eval_episodes: 48
  save_replay_buffer: false
