environment:
  curriculum: table_waypoint_polyline
  episode_steps: 2000
  absolute_action_limit: 0.60
  max_action_delta: 0.003
  action_mode: table_cartesian_delta
  table_action_calibration_path: data/processed/manisoft_table_arch_action_calibration_v1/calibration_bounded.npz
  cartesian_action_step_scale: 0.020
  cartesian_action_leak: 0.0012
  cartesian_prior_weight: 1.0
  cartesian_prior_proportional_gain: 18.0
  cartesian_prior_feedforward_scale: 1.0
  cartesian_prior_internal_waypoints_only: false
  observation_mode: gate74
  workspace_low: [0.18, 0.285, 0.420]
  workspace_high: [0.54, 0.65, 0.490]
  max_reach: 1.20
  # 2--4 segments means 3--5 total points including the initial point.
  waypoint_segment_count_range: [2, 4]
  waypoint_segment_count_probabilities: [0.25, 0.45, 0.30]
  waypoint_segment_length_range: [0.075, 0.125]
  waypoint_maximum_extent: 0.30
  waypoint_minimum_turn_degrees: 60.0
  waypoint_maximum_turn_degrees: 120.0
  waypoint_vertical_delta_range: [0.0, 0.0]
  waypoint_single_line_probability: 0.0
  internal_waypoint_capture_radius: 0.015
  internal_waypoint_bonus: 1.0
  internal_waypoint_progress_scale: 0.30
  internal_waypoint_distance_penalty_scale: 0.12
  waypoint_stall_steps: 1200
  waypoint_stall_distance_epsilon: 0.0003
  tracking_guard: 0.04
  target_lead_distance: 0.015
  lookahead_distance: 0.030
  maximum_projection_advance: 0.025
  projection_backtrack: 0.005
  success_threshold: 0.010
  success_streak: 8
  terminal_capture_radius: 0.020
  stall_grace_steps: 300
  stall_window_steps: 1500
  stall_progress_epsilon: 0.0004
  table_surface_z: 0.36
  minimum_tip_z: 0.410
  table_x_bounds: [0.15, 0.65]
  table_y_bounds: [0.28, 0.72]
  arm_radius: 0.050
  table_safety_margin: 0.005
  enforce_whole_arm_table_clearance: true
  target_tip_tangent: [0.0, 0.0, -1.0]
  tip_orientation_penalty_scale: 0.30
  maximum_tip_orientation_error_degrees: 35.0
  tip_orientation_violation_penalty: 75.0
  terminate_on_tip_orientation_violation: true
  entry_bank_path: data/processed/manisoft_table_arch_entry_v1/entry_bank.npz
  entry_sampling_weights: [1.0]
  min_desired_speed: 0.012
  max_desired_speed: 0.035
  requested_rate_penalty_scale: 0.001
  policy_action_penalty_scale: 0.005
  endpoint_progress_scale: 0.0
  terminal_precision_scale: 2.0
  terminal_distance_penalty_scale: 1.0
  table_violation_penalty: 300.0
  terminal_settle_steps: 500
  terminal_timeout_penalty: 75.0

sac:
  learning_rate: 0.0001
  buffer_size: 500000
  learning_starts: 10000
  batch_size: 1024
  tau: 0.005
  gamma: 0.998
  train_freq: 1
  gradient_steps: 4
  ent_coef: auto_0.03
  target_entropy: -1.0
  net_arch: [256, 256, 256]

training:
  total_timesteps: 600000
  num_envs: 24
  checkpoint_freq: 50000
  eval_freq: 25000
  eval_episodes: 48
  save_replay_buffer: false
