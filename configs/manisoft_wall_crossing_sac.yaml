schema_version: 1

# Stage 1 only: starting after the tip has rounded a wall end, learn to pull a
# contiguous distal portion of the arm beyond the far face.  Target-plane
# return, target-point tracking and button pressing are intentionally absent.
environment:
  episode_steps: 300
  absolute_action_limit: 0.30
  max_action_delta: 0.005
  success_crossed_fraction: 0.30
  success_streak: 5
  maximum_tip_speed: 0.75

  # Near-goal reset curriculum for the preliminary controller.  Once this is
  # deterministic on both sides, resume a wider stage that lowers the minimum
  # to 0.05 while retaining these 15%--25% anchors.
  snapshot_minimum_fraction: 0.15
  snapshot_maximum_fraction: 0.25
  snapshot_progress_bias: 10.0

  threading_progress_reward_scale: 60.0
  crossed_progress_reward_scale: 20.0
  tip_progress_reward_scale: 2.0
  collision_penalty: 15.0
  success_bonus: 15.0
  near_wall_clearance: 0.01
  near_wall_penalty_scale: 0.20
  step_penalty: 0.01
  policy_action_penalty_scale: 0.005
  activation_penalty_scale: 0.001

training:
  seed: 20260825
  total_timesteps: 100000
  num_envs: 2
  learning_rate: 0.0001
  buffer_size: 200000
  learning_starts: 10000
  batch_size: 512
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.001
  target_entropy: -9.0
  net_arch: [256, 256, 256]
  checkpoint_freq: 10000
  status_freq: 2000
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
