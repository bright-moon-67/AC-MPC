schema_version: 1

# Single-homotopy Phase A.  The task only requires one valid wall end, so this
# controller is trained on the +x/right route where the earlier 2500-step
# policy obtained its two deterministic 40% successes.
environment:
  episode_steps: 300
  absolute_action_limit: 0.60
  muscle_torque_scale: 45.0
  max_action_delta: 0.0005
  success_crossed_fraction: 0.40
  success_streak: 5
  maximum_tip_speed: null
  allowed_route_side: 1

  snapshot_minimum_fraction: 0.30
  snapshot_maximum_fraction: 0.35
  snapshot_progress_bias: 10.0

  return_tip_x_tolerance: null
  return_reward_minimum_fraction: 0.40
  return_progress_reward_scale: 0.0

  threading_progress_reward_scale: 100.0
  crossed_progress_reward_scale: 70.0
  tip_progress_reward_scale: 3.0
  collision_penalty: 40.0
  success_bonus: 30.0
  near_wall_clearance: 0.025
  near_wall_penalty_scale: 2.0
  step_penalty: 0.005
  policy_action_penalty_scale: 0.01
  activation_penalty_scale: 0.003

training:
  seed: 20260902
  total_timesteps: 10000
  num_envs: 2
  learning_rate: 0.00005
  buffer_size: 100000
  learning_starts: 500
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.0005
  target_entropy: -9.0
  net_arch: [256, 256, 256]
  checkpoint_freq: 2500
  status_freq: 500
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
