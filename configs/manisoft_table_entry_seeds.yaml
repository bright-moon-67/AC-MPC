# Static activation seeds are converted into slow minimum-jerk bends and then
# independently replayed in the current gravity-enabled PyElastica scenario.
# They are merely search seeds: only trajectories passing endpoint, stability,
# action-rate, and whole-arm/table clearance checks enter the generated bank.
table:
  # Selected by a full-arm clearance sweep. The lower top and nearer front
  # edge expose the z=0.45--0.52 m operating band without intersecting the rod.
  x_bounds: [-0.55, 0.55]
  y_bounds: [0.42, 0.86]
  surface_z: 0.36
  arm_radius: 0.05
  safety_margin: 0.005

workspace:
  low: [-0.30, 0.50, 0.445]
  high: [0.30, 0.80, 0.54]
  # The certified left entry settles at 0.9007 m from the base. 0.91 m keeps
  # a 9 cm margin to the actual 1 m rod length while avoiding an artificial
  # rejection at the old rounded 0.90 m cutoff.
  max_reach: 0.91

motion:
  ramp_steps: 300
  hold_steps: 100
  maximum_action_delta: 0.01
  maximum_hold_tip_span: 0.002
  maximum_replay_tip_error: 0.00002

seeds:
  # Source IDs document how the static activation was discovered. Runtime
  # generation has no dependency on the source episode or Koopman dataset.
  - name: right_entry
    source: exploration_episode_406
    align_rotation_degrees: 158.52
    rotation_offset_degrees: -20.0
