schema_version: 1

# Tight continuation from the reproducible 25 cm joint checkpoint.  The
# unmodified policy reaches 18 cm while retaining 40%, but then clips the wall
# by <0.9 mm before completing the three-step success streak.
environment:
  episode_steps: 300
  absolute_action_limit: 0.60
  muscle_torque_scale: 45.0
  max_action_delta: 0.0005
  success_crossed_fraction: 0.40
  success_streak: 3
  maximum_tip_speed: null
  allowed_route_side: 1

  snapshot_minimum_fraction: 0.40
  snapshot_maximum_fraction: 0.40
  snapshot_progress_bias: 0.0

  return_tip_x_tolerance: 0.20
  return_reward_minimum_fraction: 0.40
  return_progress_reward_scale: 24.0

  threading_progress_reward_scale: 130.0
  crossed_progress_reward_scale: 170.0
  crossing_deficit_penalty_scale: 100.0
  tip_progress_reward_scale: 2.0
  collision_penalty: 120.0
  success_bonus: 150.0
  near_wall_clearance: 0.020
  near_wall_penalty_scale: 20.0
  step_penalty: 0.002
  policy_action_penalty_scale: 0.002
  activation_penalty_scale: 0.001

training:
  seed: 20260908
  total_timesteps: 5000
  num_envs: 2
  learning_rate: 0.00001
  buffer_size: 100000
  learning_starts: 300
  batch_size: 256
  tau: 0.005
  gamma: 0.997
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.0002
  target_entropy: -9.0
  continuation_log_std_bias_delta: -0.7
  net_arch: [256, 256, 256]
  checkpoint_freq: 1250
  status_freq: 500
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
