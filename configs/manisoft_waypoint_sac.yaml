environment:
  curriculum: mixed
  episode_steps: 600
  absolute_action_limit: 0.30
  max_action_delta: 0.01
  workspace_low: [-0.30, 0.38, 0.445]
  workspace_high: [0.30, 0.72, 0.56]
  max_reach: 0.90
  tracking_guard: 0.050
  lookahead_distance: 0.050
  success_threshold: 0.025
  success_streak: 8
  table_surface_z: 0.39
  minimum_tip_z: 0.405
  min_desired_speed: 0.015
  max_desired_speed: 0.12
  requested_rate_penalty_scale: 0.01
  terminal_precision_scale: 0.40
  terminal_distance_penalty_scale: 0.15

sac:
  learning_rate: 0.0003
  buffer_size: 2000000
  learning_starts: 20000
  batch_size: 512
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  net_arch: [256, 256, 256]

training:
  total_timesteps: 1000000
  num_envs: 8
  checkpoint_freq: 100000
  eval_freq: 100000
  eval_episodes: 3
  # Replay buffers are several GB at full capacity. Model and normalization
  # checkpoints are sufficient for curriculum transfer; enable this only for
  # an exact same-stage optimizer/data resume.
  save_replay_buffer: false
