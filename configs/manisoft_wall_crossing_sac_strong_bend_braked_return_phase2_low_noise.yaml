schema_version: 1

# Low-noise Phase-B transfer.  The inherited actor mean is preserved while
# the inherited near-unit action standard deviation is reduced by exp(-3).
environment:
  episode_steps: 300
  absolute_action_limit: 0.60
  muscle_torque_scale: 45.0
  max_action_delta: 0.001
  success_crossed_fraction: 0.40
  success_streak: 5
  maximum_tip_speed: null

  snapshot_minimum_fraction: 0.30
  snapshot_maximum_fraction: 0.35
  snapshot_progress_bias: 10.0

  return_tip_x_tolerance: 0.10
  return_reward_minimum_fraction: 0.40
  return_progress_reward_scale: 8.0

  threading_progress_reward_scale: 80.0
  crossed_progress_reward_scale: 60.0
  tip_progress_reward_scale: 3.0
  collision_penalty: 35.0
  success_bonus: 30.0
  near_wall_clearance: 0.02
  near_wall_penalty_scale: 1.5
  step_penalty: 0.01
  policy_action_penalty_scale: 0.01
  activation_penalty_scale: 0.003

training:
  seed: 20260831
  total_timesteps: 5000
  num_envs: 2
  learning_rate: 0.00001
  buffer_size: 50000
  learning_starts: 0
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 1
  ent_coef: 0.0001
  target_entropy: -9.0
  continuation_log_std_bias_delta: -3.0
  net_arch: [256, 256, 256]
  checkpoint_freq: 2500
  status_freq: 500
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
